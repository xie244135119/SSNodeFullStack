# g-backend backend — docker compose 部署
# 本文件与 Dockerfile 同级:开发机在 backend/ 根,buildops 拷入产物 releases/<version>-<ts>/(→ 服务器 current/),
# compose 与 Dockerfile 同处 current/ 根。
# 镜像: image:<TAG>(TAG 来自 .env,由 docker/install.sh 以 current/ 为 context 现场构建)
# 配置: 环境变量注入(见 .env.example / configuration.ts env override)
# 数据: bind mount DATA_DIR → /app/data(跨版本共享,轮转/回滚不动)
# 运维: 直接用 docker compose 命令(up/down/logs/ps),无需额外 shell

services:
  backend:
    # 镜像名与 docker/install.sh 的 config.sh IMAGE 默认对齐(g-backend-backend),
    # tag = <version>-<14位ts>(install.sh 现场 build 时已对齐 .env 的 TAG)。
    image: ${IMAGE:-g-backend-backend}:${TAG}
    # build context = current/(compose 文件所在目录);docker compose up --build 现场 build。
    # 迁移机若已 docker load 同 tag 镜像,docker compose up(不带 --build)直接用已加载镜像。
    build: .
    container_name: ${CONTAINER_NAME:-g-backend-backend}
    restart: unless-stopped
    # 端口权威 = .env 的 PORT(env 注入,app 读 PORT 监听);宿主映射 = 容器监听 = PORT。
    # 迁移换端口只改 .env 的 PORT,镜像不动。
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      NODE_ENV: ${NODE_ENV:-prod}
      # PORT 权威在此(app 读 PORT 监听;未注入则回退镜像内 config/config.prod.yaml app.port)。
      PORT: ${PORT:-3001}
      # 容器内持久化路径写死(随 /app/data mount 目标锁定,非部署期变量):
      #   DB_DIR              → sqlite 主库所在目录(文件名由程序定死为 g-backend.prod.sqlite)
      #   UPLOAD_STORAGE_PATH → 上传文件子目录
      # 部署期只调宿主 DATA_DIR(mount 源),容器内布局固定、不可错位。
      DB_DIR: /app/data
      UPLOAD_STORAGE_PATH: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES: ${JWT_EXPIRES:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_SIGN_KEY: ${APP_SIGN_KEY:-}
      APP_SIGN_TS_WINDOW: ${APP_SIGN_TS_WINDOW:-}
    volumes:
      # 单一宿主持久化根 → /app/data(容器内固定)。db/backup/logs/uploads 全落此 volume 子目录,
      # 后续追加新子目录无需再加 mount。DATA_DIR 必填,不设默认值以免误落到错误宿主路径。
      - ${DATA_DIR:?DATA_DIR must be set in .env}:/app/data
    healthcheck:
      # 无独立 /health 接口,改用 TCP 端口探测(容器内自连,端口须与 .env PORT 一致)
      test: ["CMD", "node", "-e", "require('net').connect(${PORT:-3001},'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
